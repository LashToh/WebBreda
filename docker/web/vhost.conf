<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # FollowSymLinks is required: our ./src overlay is symlinked into the
        # webroot so edits on the host are picked up live (hot reload).
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Honour the protocol from ngrok / reverse proxies so WebEngine builds
    # https:// URLs when tunnelled (needed for payment webhooks).
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
