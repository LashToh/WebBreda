name: webbreda

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Never auto-start on boot / Docker restart — only when the user runs `just dev`.
    restart: "no"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASS}
      MSSQL_PID: Developer
      # Cap SQL Server's own memory use (stay under the container limit below).
      MSSQL_MEMORY_LIMIT_MB: ${DB_MSSQL_MEMORY_MB:-2048}
    ports:
      - "${DB_PORT_HOST:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./db:/db
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-2}"
          memory: ${DB_MEMORY:-3g}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./docker/web
      args:
        WEBENGINE_VERSION: ${WEBENGINE_VERSION:-1.2.7}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WEBENGINE_VERSION: ${WEBENGINE_VERSION:-1.2.7}
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SQL_PDO_DRIVER: "1"
      WEBSITE_TEMPLATE: ${WEBSITE_TEMPLATE}
      WEBENGINE_ADMIN_USER: ${WEBENGINE_ADMIN_USER}
      SERVER_NAME: ${SERVER_NAME}
      WEBSITE_TITLE: ${WEBSITE_TITLE}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - webroot:/var/www/html
      - ./src:/src
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPUS:-1.5}"
          memory: ${WEB_MEMORY:-768m}

  # Tunnel for testing payment webhooks. Started on demand via `just ngrok`.
  ngrok:
    image: ngrok/ngrok:latest
    restart: "no"
    profiles: ["ngrok"]
    depends_on:
      - web
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "web:80"]
    ports:
      - "${NGROK_WEB_PORT:-4040}:4040"
    deploy:
      resources:
        limits:
          cpus: "${NGROK_CPUS:-0.5}"
          memory: ${NGROK_MEMORY:-128m}

volumes:
  mssql-data:
  webroot:
